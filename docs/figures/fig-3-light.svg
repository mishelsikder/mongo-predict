<svg xmlns="http://www.w3.org/2000/svg" width="820" viewBox="0 0 820 246" role="img" aria-labelledby="f3t"><style>
text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #14140f; }
.muted { fill: #6b6b64; } .sub { fill: #3d3d38; }
.box { fill: #f7f7f5; stroke: #d8d8d2; } .box2 { fill: #ecece7; stroke: #d8d8d2; }
