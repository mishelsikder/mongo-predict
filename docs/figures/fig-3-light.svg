    <rect x="242" y="40" width="156.4" height="18" rx="4" class="bar-base"/>
    <text x="406.4" y="53.5" class="sub">64.6</text>
    <text x="230" y="79.5" text-anchor="end" class="sub">Qwen3-Embedding-0.6B (596M)</text>
    <rect x="242" y="66" width="251.6" height="18" rx="4" class="bar-base"/>
    <text x="501.6" y="79.5" class="sub">67.4</text>
    <text x="230" y="105.5" text-anchor="end" class="sub">Nemotron-3-Embed-1B (1.1B)</text>
    <rect x="242" y="92" width="302.6" height="18" rx="4" class="bar-base"/>
    <text x="552.6" y="105.5" class="sub">68.9</text>
    <text x="230" y="131.5" text-anchor="end" class="sub">Qwen3-Embedding-4B (4.0B)</text>
    <rect x="242" y="118" width="309.4" height="18" rx="4" class="bar-base"/>
    <text x="559.4" y="131.5" class="sub">69.1</text>
    <text x="230" y="157.5" text-anchor="end" class="sub">Nemotron-3-Embed-8B (8.0B)</text>
    <rect x="242" y="144" width="367.2" height="18" rx="4" class="bar-base"/>
    <text x="617.2" y="157.5" class="sub">70.8</text>
    <text x="230" y="183.5" text-anchor="end" class="sub">voyage-4-nano (346M)</text>
    <rect x="242" y="170" width="340.0" height="18" rx="4" class="bar" opacity=".75"/>
