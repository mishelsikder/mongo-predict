</style>
  <rect class="figbg" x="0" y="0" width="820" height="246" rx="10" fill="#ffffff"/>
  <title id="f3t">Average performance over 50 tasks with the raw fields plus the embedding of each model: models not made by Voyage 62.9 to 70.8; voyage-4-nano (346M parameters) 70.0; voyage-json (API) 73.3.</title>
  <g font-size="13">
    <text x="230" y="27.5" text-anchor="end" class="sub">all-MiniLM-L6-v2 (23M)</text>
